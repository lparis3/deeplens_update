[project]
name = "new-deeplens-pipeline"
version = "0.1.0"
description = "Strong lensing simulation pipeline with normalizing flow sampling"
authors = [
  { name = "Lucca Paris" }
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=64","wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
